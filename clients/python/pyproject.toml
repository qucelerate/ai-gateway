[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qucelerate-ai-gateway"
version = "2026.11.0-rc.1"
description = "Client for the QuCelerate AI Gateway inference API (contract 1.0.0)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
keywords = ["llm", "ai-gateway", "openai", "inference", "client"]
authors = [{ name = "QuCelerate", email = "opensource@qucelerate.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gateway.qucelerate.com"
Documentation = "https://gateway.qucelerate.com"
Source = "https://github.com/qucelerate/ai-gateway/tree/main/clients/python"
Issues = "https://github.com/qucelerate/ai-gateway/issues"
Changelog = "https://github.com/qucelerate/ai-gateway/blob/main/clients/python/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/qucelerate_ai_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
