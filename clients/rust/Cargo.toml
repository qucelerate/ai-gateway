[package]
name = "qucelerate-ai-gateway"
version = "2026.11.0-rc.3"
edition = "2024"
rust-version = "1.85"
description = "Client for the QuCelerate AI Gateway inference API (contract 1.0.0)"
license = "MIT"
readme = "README.md"
authors = ["QuCelerate <opensource@qucelerate.com>"]
repository = "https://github.com/qucelerate/ai-gateway"
homepage = "https://gateway.qucelerate.com"
documentation = "https://docs.rs/qucelerate-ai-gateway"
keywords = ["llm", "ai-gateway", "openai", "inference", "client"]
categories = ["api-bindings", "web-programming::http-client", "asynchronous"]
# Published to crates.io by .github/workflows/release.yml, from the
# public repository only (clients/release/README.md, *Registries*).
publish = true
# Only what builds and documents the crate: the tests read
# clients/conformance, which a crate cannot carry.
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

# A standalone workspace: the client shares nothing with the gateway server
# crate, and building it never pulls in the server's dependencies.
[workspace]

[dependencies]
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time"] }
