# The load test's database (tests/load/run.sh, Compose project
# gateway-load): PostgreSQL alone. The gateways, worker, fake provider and
# generator run as host processes, so a gateway can be killed and restarted
# mid-run and reaches the fake on loopback, as it must. Paths are relative
# to this file.
services:
  postgres:
    # The image compose.yaml pins; CI sets POSTGRES_IMAGE to its GHCR copy.
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway_bootstrap_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set by run.sh}
      GATEWAY_APP_USER: gateway_app
      GATEWAY_APP_PASSWORD: ${GATEWAY_APP_PASSWORD:?set by run.sh}
    # Durable commits (synchronous_commit stays on, as D-030 requires);
    # enough connections for several gateways' pools and the samplers.
    command:
      - postgres
      - -c
      - max_connections=${LOAD_PG_MAX_CONNECTIONS:-400}
      - -c
      - shared_buffers=${LOAD_PG_SHARED_BUFFERS:-1GB}
      - -c
      - track_io_timing=on
    ports:
      - "127.0.0.1:${LOAD_PG_PORT:-25532}:5432"
    volumes:
      - load-postgres-data:/var/lib/postgresql/data
      - ../../docker/postgres/001-create-gateway-app.sh:/docker-entrypoint-initdb.d/001-create-gateway-app.sh:ro
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_bootstrap_admin -d gateway"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  load-postgres-data:
