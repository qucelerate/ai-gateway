# cargo-deny policy for the gateway crate (`cargo deny check`).
#
#   cargo deny check licenses advisories bans sources
#
# Licenses: permissive licenses only, plus MPL-2.0 (file-level copyleft,
# acceptable for unmodified dependencies; no crate uses it today, so
# cargo-deny warns that it was not encountered). Advisories: as `cargo audit`
# (.cargo/audit.toml). Duplicate versions are warnings: they cost build time,
# not correctness.

[graph]
all-features = false

[advisories]
version = 2
yanked = "warn"
# cargo audit's two exceptions (.cargo/audit.toml: rsa, libsqlite3-sys) are
# not needed here: cargo-deny resolves features, so the unused sqlx-mysql and
# sqlx-sqlite crates, and the advisories against them, are not in its graph.
ignore = [
    # chrono: marked unmaintained (no vulnerability). It is used throughout
    # the gateway and by sqlx; moving to jiff or time is a separate change.
    # cargo audit reports this as a warning only.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; migration to jiff/time tracked separately" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
