# One origin for the admin UI and the gateway, as the UI's cookie sessions
# and CSRF checks require: /api/* and /healthz go to the gateway, the rest to
# the admin UI. A Kubernetes ingress or cloud load balancer does the same
# with two path rules.
# Service names are looked up through Docker's DNS when requests arrive, not
# once at startup, so a replaced gateway or admin container is found at its
# new address. (A variable in proxy_pass is what makes nginx resolve again.)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Catalog manifests are up to 1 MiB; the gateway enforces its own limits.
    client_max_body_size 2m;

    set $gateway http://gateway:3000;
    set $admin http://admin:8080;

    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        # The browser's Host and Origin pass through unchanged: the gateway
        # checks Origin against GATEWAY_ORIGIN.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;
        # Streamed completions and exports: send each chunk as it arrives,
        # and allow long-running streams.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 15m;
        proxy_send_timeout 15m;
    }

    location = /healthz {
        proxy_pass $gateway;
    }

    location / {
        proxy_pass $admin;
        proxy_set_header Host $http_host;
    }
}
