# The docs site's static files. VitePress builds clean URLs: /guide/concepts
# is guide/concepts.html, /guide/ is guide/index.html. Hashed assets are
# cached for good; pages are revalidated, so a release shows at once.
server {
    listen 8080;
    # IPv6 too, where the container has it: 30-listen-on-ipv6.sh writes it
    # at startup (D-026). nginx refuses `[::]` outright where IPv6 is off.
    include /tmp/nginx-listen/*.conf;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    error_page 404 /404.html;

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Successful responses only: a 404 during a release must not be
        # cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
