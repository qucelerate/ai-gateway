# Response headers for every docs response. nginx drops server-level
# add_header in any location with its own, so each location includes this.
# VitePress inlines small scripts in every page (the theme's dark-mode
# check and its page hash map, which changes with every build), so scripts
# allow 'unsafe-inline'; the site has no forms, no cookies and no data to
# take. Everything else is the site's own.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" always;
