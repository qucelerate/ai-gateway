# cargo-about configuration: the third-party license list of the gateway's
# Rust dependencies (scripts/third-party-notices.sh). Keep `accepted` in step
# with deny.toml's [licenses] allow list.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
# Only what the gateway binary links on the platforms it ships for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
