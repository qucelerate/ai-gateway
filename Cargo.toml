[package]
name = "gateway"
version = "2026.11.0-rc.1"
edition = "2024"
rust-version = "1.85"
description = "A modular Rust AI gateway"
license = "MIT"
build = "build.rs"
# `cargo run` starts the gateway; the client CLI is `--bin gwctl`.
default-run = "gateway"

# Clippy baseline for the shared foundation. These lints are pre-existing
# design choices across the gateway: large typed error enums returned directly,
# `&mut **transaction` handle auto-derefs, multi-argument constructors,
# unit-like structs without `Default`, and a handful of stylistic micro-lints.
# Pinned here (applies to the library and every test target) so
# `cargo clippy --all-targets -- -D warnings` is a meaningful gate for
# genuinely new code without rewriting foundation modules.
#
# `await_holding_lock` is intentionally NOT allowed here: the only occurrence
# is the deliberate `MutexGuard`-held-across-await database serialization
# pattern in integration test files, which is allowed narrowly at the top of
# those test files so future production deadlocks keep surfacing.
[lints.clippy]
bool_assert_comparison = "allow"
clone_on_copy = "allow"
cmp_owned = "allow"
explicit_auto_deref = "allow"
manual_contains = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
new_without_default = "allow"
redundant_closure = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
useless_conversion = "allow"

[dependencies]
axum = { version = "0.8.8", features = ["http2", "json", "multipart"] }
async-trait = "0.1.89"
async-stream = "0.3.6"
aes-gcm = "0.10.3"
base64 = "0.22.1"
bytes = "1.10.1"
dotenvy = "0.15.7"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2.0.17"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
hmac = "0.12.1"
hkdf = "0.12.4"
md-5 = "0.10.6"
rand = "0.8.5"
ring = "0.17.14"
reqwest = { version = "0.12.23", default-features = false, features = ["http2", "json", "multipart", "rustls-tls", "stream"] }
sha2 = "0.10.9"
socket2 = "0.6.5"
subtle = "2.6.1"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.7"
zeroize = { version = "1.9.0", features = ["serde"] }
argon2 = { version = "0.5.3", features = ["std"] }
hickory-resolver = "0.26.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Trust roots for `gateway doctor --network`'s TLS handshakes.
webpki-roots = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful", "tokio", "service", "http1", "http2"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
http-body = "1"
http-body-util = "0.1.3"

[dev-dependencies]
# Parses the Terraform the onboarding instructions emit.
hcl-rs = "0.19"
http-body-util = "0.1.3"
tokio = { version = "1.47.1", features = ["test-util"] }
