name: Java client

on:
  push:
    # main only: a pull request runs this for its branch.
    branches: [main]
    paths:
      - ".github/actions/apt-packages/**"
      - "clients/java/**"
      - "clients/conformance/**"
      - ".github/workflows/clients-java.yml"
  pull_request:
    paths:
      - ".github/actions/apt-packages/**"
      - "clients/java/**"
      - "clients/conformance/**"
      - ".github/workflows/clients-java.yml"

permissions:
  contents: read

concurrency:
  group: clients-java-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/java

jobs:
  check-and-test:
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    strategy:
      matrix:
        # 17 is the oldest release supported (pom.xml compiles with --release 17).
        java: ["17", "21", "25"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Install Maven
        uses: ./.github/actions/apt-packages
        with:
          packages: mvn=maven

      # The tests include ConformanceTest, which runs every case of
      # clients/conformance; -Werror fails the build on any compiler warning.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Compile the example
        run: |
          mvn -B -ntp -q dependency:build-classpath -Dmdep.includeScope=runtime -Dmdep.outputFile=classpath.txt
          javac -d target/examples -cp "target/classes:$(cat classpath.txt)" examples/Chat.java
