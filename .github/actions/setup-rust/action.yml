name: Set up Rust
description: >
  Installs a Rust toolchain with rustup and makes it the default. GitHub's
  runners have rustup; on the self-hosted runner it is installed once into
  the runner user's home (rustup's own installer, verified by checksum) and
  kept, as are the toolchains.
inputs:
  toolchain:
    description: The toolchain, for example stable or 1.85.
    default: stable
  components:
    description: Comma-separated rustup components, for example clippy,rustfmt.
    default: ""
runs:
  using: composite
  steps:
    - name: Install rustup if missing
      shell: bash
      env:
        # rustup-init 1.28.2 for x86_64-unknown-linux-gnu, from
        # https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init.sha256
        RUSTUP_VERSION: 1.28.2
        RUSTUP_SHA256: 20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            init="$RUNNER_TEMP/rustup-init"
            curl -fsSLo "$init" \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "$RUSTUP_SHA256  $init" | sha256sum -c -
            chmod +x "$init"
            "$init" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        rustup --version
    - name: Install the toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        rustup toolchain install "$TOOLCHAIN" --profile minimal ${COMPONENTS:+--component "$COMPONENTS"}
        rustup default "$TOOLCHAIN"
