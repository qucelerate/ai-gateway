{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.name" . }}-admin
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "root" . "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" (dict "root" . "component" "admin") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gateway.podSecurity" . | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.adminImage.repository }}:{{ .Values.adminImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.adminImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            {{- include "gateway.containerSecurity" . | nindent 12 }}
          # nginx writes its pid and temporary files here.
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.name" . }}-admin
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  {{- include "gateway.serviceFamilies" . | nindent 2 }}
  selector:
    {{- include "gateway.selectorLabels" (dict "root" . "component" "admin") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
