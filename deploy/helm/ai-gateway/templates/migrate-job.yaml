{{- if .Values.controlPlane.enabled }}
# Applies migrations before every install and upgrade (a Helm hook, and an
# Argo CD PreSync hook for Argo-managed releases), as a rolling release
# requires: the new pods start only after it succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gateway.name" . }}-migrate
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "gateway.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gateway.podSecurity" . | nindent 8 }}
        {{- include "gateway.runAs" . | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "gateway.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "gateway.env" (dict "root" . "profile" "api") | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext:
            {{- include "gateway.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
